[package]
name = "finite-difference-pde"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SuperInstance/finite-difference-pde"
description = "Finite difference PDE solvers in Rust — heat equation, wave equation, Poisson, advection-diffusion with boundary conditions"

[dependencies]
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
num-traits = "0.2"

[dev-dependencies]
approx = "0.5"
